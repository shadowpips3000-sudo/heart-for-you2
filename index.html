<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Animation</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }

    #container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      /* Force GPU hardware acceleration */
      will-change: transform;
    }

    .heart-node {
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
    }

    .heart-text {
      color: #ff69b4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
      /* Mobile-optimized single shadow layer */
      text-shadow: 0 0 8px #ff007f;
      animation: pulse 1.6s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.85);
        opacity: 0.7;
      }
      100% {
        transform: scale(1.1);
        opacity: 1;
        text-shadow: 0 0 12px #ff69b4;
      }
    }
  </style>
</head>
<body>

  <div id="container"></div>

  <script>
    function drawHeart() {
      const container = document.getElementById("container");
      container.innerHTML = ""; 

      // Reduced item count slightly for better mobile performance
      const totalItems = 75; 
      const scale = 11; // Optimized size for phone screens

      const fragment = document.createDocumentFragment();

      for (let i = 0; i < totalItems; i++) {
        const t = (i / totalItems) * Math.PI * 2;

        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

        const dx = 48 * Math.pow(Math.sin(t), 2) * Math.cos(t);
        const dy = 13 * Math.sin(t) - 10 * Math.sin(2 * t) - 6 * Math.sin(3 * t) - 4 * Math.sin(4 * t);
        const angle = Math.atan2(-dy, dx) * (180 / Math.PI);

        const node = document.createElement("div");
        node.className = "heart-node";
        
        // GPU-accelerated positioning using 3D transforms
        const posX = x * scale;
        const posY = y * scale;
        node.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;

        const text = document.createElement("div");
        text.className = "heart-text";
        text.textContent = "I love you";
        text.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        text.style.animationDelay = `${(i * 0.025).toFixed(2)}s`;

        node.appendChild(text);
        fragment.appendChild(node);
      }

      container.appendChild(fragment);
    }

    window.onload = drawHeart;
  </script>

</body>
</html>
