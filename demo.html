<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .ui {
      position: relative;
    }

    .love {
      position: absolute;
      transform: translate(-50%, -50%);
    }

    .love_word {
      color: #ff69b4;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      text-shadow: 
        0 0 5px #ff69b4,
        0 0 10px #ff69b4,
        0 0 20px #ff007f,
        0 0 35px #ff007f;
      animation: pulse 1.8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.85);
        opacity: 0.6;
      }
      100% {
        transform: scale(1.15);
        opacity: 1;
        text-shadow: 
          0 0 8px #ff69b4,
          0 0 15px #ff69b4,
          0 0 25px #ff007f,
          0 0 45px #ff007f;
      }
    }
  </style>
</head>
<body>

  <div class="ui" id="ui"></div>

  <script>
    const ui = document.getElementById("ui");
    const totalItems = 100;
    const scale = 16; // Scale factor for heart size

    for (let i = 1; i <= totalItems; i++) {
      // Calculate angle t in radians
      const t = (i / totalItems) * 2 * Math.PI;

      // Heart parametric formulas
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

      // Calculate tangent angle so the text rotates along the curve
      const dx = 48 * Math.pow(Math.sin(t), 2) * Math.cos(t);
      const dy = 13 * Math.sin(t) - 10 * Math.sin(2 * t) - 6 * Math.sin(3 * t) - 4 * Math.sin(4 * t);
      const angle = Math.atan2(dy, dx) * (180 / Math.PI);

      const love = document.createElement("div");
      love.className = "love";
      
      // Position and rotate directly via JS
      love.style.left = `${x * scale}px`;
      love.style.top = `${y * scale}px`;

      const word = document.createElement("div");
      word.className = "love_word";
      word.textContent = "I love you";
      word.style.transform = `rotate(${angle}deg)`;
      word.style.animationDelay = `${i * 0.02}s`;

      love.appendChild(word);
      ui.appendChild(love);
    }
  </script>

</body>
</html>
